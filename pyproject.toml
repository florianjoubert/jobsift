[project]
name = "jobsift"
version = "0.1.0"
description = "Agent de matching d'offres multi-source avec scoring IA"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "langdetect>=1.0.9",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "respx>=0.23.1",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
